dataset:
  # Point this to a directory containing:
  # train/<class>, val/<class>, test/<class>
  path: /path/to/data.v0

classes:
  0: hsrp
  1: non-hsrp

training:
  batch_size: 32
  num_workers: 2
  phase1:
    epochs: 5
    learning_rate: 0.0001
    freeze_backbone: true
  phase2:
    epochs: 20
    learning_rate: 0.00001
    unfreeze_last_feature_blocks: 2

optimization:
  scheduler: ReduceLROnPlateau
  scheduler_mode: min
  scheduler_patience: 3
  scheduler_factor: 0.1
  loss: BCEWithLogitsLoss

input:
  size: [224, 224]
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

inference:
  threshold: 0.5
